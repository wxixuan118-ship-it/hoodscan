name: Sync token data

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

concurrency:
  group: sync
  cancel-in-progress: false   # never cancel a running sync — let it finish

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        run: npx tsx scripts/sync.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
